name: Update profile

# Rebuilds the live sections of README.md (contribution card, product status, /now)
# once a day. Commits are authored by the Actions bot on purpose: they must not
# show up as my own contributions, or the card would be painting its own squares.

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC (08:17 in Pakistan)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/products.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild README sections
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs even if a section failed above, so the sections that did build still land.
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: refresh profile ($(date -u +%Y-%m-%d))"
          git push
